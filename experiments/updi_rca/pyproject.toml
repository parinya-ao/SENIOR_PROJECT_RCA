[project]
name = "updi-rca"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pyserial>=3.5"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "hardware: requires a connected UPDI target",
  "destructive: modifies target nonvolatile memory",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
