[platformio]
default_envs = sender, receiver

[env]
platform = atmelmegaavr
board = AVR128DA28
framework = arduino
monitor_speed = 115200

[env:sender]
upload_protocol = serialupdi
upload_port = /dev/ttyUSB1
upload_speed = 115200

build_src_filter =
    -<*>
    +<sender/>

[env:receiver]
upload_protocol = serialupdi
upload_port = /dev/ttyUSB0
upload_speed = 115200

build_src_filter =
    -<*>
    +<receiver/>
