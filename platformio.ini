[platformio]
extra_configs =
    generated/lora_platformio.ini
default_envs = sender, receiver

[env]
platform = atmelmegaavr
board = AVR128DA28
framework = arduino
extra_scripts = pre:tools/config/platformio_generate.py
board_build.text_section_start = ${target_layout.gateway_app_start}
upload_flags = -D
lib_deps =
    jgromes/RadioLib@7.1.2
    paulstoffregen/Time@1.6.1
build_flags =
    -Os
    -flto
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -fno-exceptions
    -fno-rtti
    -fno-threadsafe-statics
    -fno-use-cxa-atexit
    -Wl,-u,vfprintf
    -lprintf_min
    -DAPPLICATION_BUILD
    -DLORA_SSOT_GENERATED=1
    -Isrc/shared
    -Iinclude

[env:debug]
build_type = debug
debug_build_flags = -Os -g2 -DDEBUG_BUILD=1

[env:release]
build_type = release

[env:sender]
extends = env:debug
upload_protocol = serialupdi
upload_port = /dev/serial/by-path/pci-0000:00:14.0-usb-0:4:1.0-port0
upload_speed = 115200
board_build.text_section_start = ${target_layout.gateway_app_start}

build_src_filter =
    -<*>
    +<sender/lib/>
    +<ssot.c>

[env:sender_hello]
extends = env:debug
upload_protocol = serialupdi
upload_port = /dev/serial/by-path/pci-0000:00:14.0-usb-0:4:1.0-port0
upload_speed = 115200
board_build.text_section_start = ${target_layout.gateway_app_start}
build_flags =
    ${env.build_flags}
    -DHELLO_TEST_MODE=1
    -DHELLO_RAM_ONLY_TEST=1

build_src_filter =
    -<*>
    +<sender/lib/>
    +<ssot.c>

[env:receiver]
extends = env:debug
build_flags =
    ${env.build_flags}
upload_protocol = serialupdi
upload_port = /dev/serial/by-path/pci-0000:00:14.0-usb-0:1:1.0-port0
upload_speed = 115200
board_build.text_section_start = ${target_layout.receiver_app_start}

build_src_filter =
    -<*>
    +<receiver/>
    +<ssot.c>

[env:sender_hello_spi]
extends = env:sender_hello
build_flags =
    ${env:sender_hello.build_flags}
    -DHELLO_RF_DIAGNOSTIC_ONLY=1

[env:receiver_spi]
extends = env:receiver
build_flags =
    ${env:receiver.build_flags}
    -DHELLO_RF_DIAGNOSTIC_ONLY=1

[env:sender_mvp]
extends = env:sender
build_src_filter =
    -<*>
    +<mvp/>

[env:receiver_mvp]
extends = env:receiver
build_src_filter =
    -<*>
    +<mvp/>
[env:sender_arq]
extends = env:sender
build_flags =
    ${env.build_flags}
    -fstack-usage
build_src_filter =
    -<*>
    +<arq/>
[env:receiver_arq]
extends = env:receiver
build_flags =
    ${env.build_flags}
    -fstack-usage
build_src_filter =
    -<*>
    +<arq/>
[env:sender_arq_test]
extends = env:sender_arq
build_flags =
    ${env:sender_arq.build_flags}
    -DARQ_TEST_MODE=1
[env:receiver_arq_test]
extends = env:receiver_arq
build_flags =
    ${env:receiver_arq.build_flags}
    -DARQ_TEST_MODE=1

[env:sender_reverse_raw]
extends = env:sender_arq
build_src_filter =
    -<*>
    +<reverse_raw/>
    +<arq/board_ssot.c>

[env:receiver_reverse_raw]
extends = env:receiver_arq
build_src_filter =
    -<*>
    +<reverse_raw/>
    +<arq/board_ssot.c>
