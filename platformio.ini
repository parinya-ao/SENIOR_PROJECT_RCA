[platformio]
extra_configs = ../iwing-tracker/device-lora_dev/generated/platformio_ssot.ini
default_envs = sender, receiver

; Read-only fuse values for the currently connected stable-path targets.
[target_layout]
gateway_bootsize = 0x00
gateway_codesize = 0x00
gateway_bodcfg = 0x00
gateway_app_start = 0x00000
receiver_bootsize = 0x2C
receiver_codesize = 0x00
receiver_bodcfg = 0x54
receiver_app_start = 0x05800

[env]
platform = atmelmegaavr
board = AVR128DA28
framework = arduino
monitor_speed = 115200
board_build.text_section_start = ${flash_geometry.appcode_start}
upload_flags = -D
lib_deps =
    SPI
    jgromes/RadioLib@7.1.2
    paulstoffregen/Time@1.6.1
    symlink://src/lib/lora
    symlink://src/lib/updi_uart
    symlink://../iwing-tracker/device-lora_dev/lib/printf
    symlink://../iwing-tracker/device-lora_dev/lib/debug
    symlink://../iwing-tracker/device-lora_dev/lib/time-utils
    symlink://../iwing-tracker/device-lora_dev/lib/sleep
    symlink://../iwing-tracker/device-lora_dev/lib/task
    symlink://../iwing-tracker/device-lora_dev/lib/iw_core
    symlink://../iwing-tracker/device-lora_dev/lib/iw_avr128da28
    symlink://../iwing-tracker/device-lora_dev/lib/iw_tracker_radio_protocol
build_flags =
    -DAPPLICATION_BUILD
    -Isrc/shared
    -I../iwing-tracker/device-lora_dev/include
    -DHELLO_RF_FREQUENCY_MHZ=923.0f
    -DHELLO_RF_TX_POWER_DBM=10
    -DHELLO_RF_LONG_RANGE=0
    -DHELLO_RF_SPREADING_FACTOR=7
    -DHELLO_RF_BANDWIDTH_KHZ=125
    -DHELLO_RF_CODING_RATE=5
    -DHELLO_RF_SYNC_WORD=0x12
    -DHELLO_RF_PREAMBLE_SYMBOLS=8
    -DHELLO_RF_CRC_ENABLED=1
    -DHELLO_RF_IQ_INVERTED=0

[env:sender]
upload_protocol = serialupdi
upload_port = /dev/serial/by-path/pci-0000:00:14.0-usb-0:4:1.0-port0
monitor_port = /dev/serial/by-path/pci-0000:00:14.0-usb-0:4:1.0-port0
upload_speed = 115200
board_build.text_section_start = ${target_layout.gateway_app_start}

build_src_filter =
    -<*>
    +<sender/lib/>
    +<shared/hello_protocol.cpp>

[env:sender_hello]
upload_protocol = serialupdi
upload_port = /dev/serial/by-path/pci-0000:00:14.0-usb-0:4:1.0-port0
monitor_port = /dev/serial/by-path/pci-0000:00:14.0-usb-0:4:1.0-port0
upload_speed = 115200
board_build.text_section_start = ${target_layout.gateway_app_start}
build_flags =
    ${env.build_flags}
    -DHELLO_TEST_MODE=1

build_src_filter =
    -<*>
    +<sender/lib/>
    +<shared/hello_protocol.cpp>

[env:receiver]
upload_protocol = serialupdi
upload_port = /dev/serial/by-path/pci-0000:00:14.0-usb-0:1:1.0-port0
monitor_port = /dev/serial/by-path/pci-0000:00:14.0-usb-0:1:1.0-port0
upload_speed = 115200
board_build.text_section_start = ${target_layout.receiver_app_start}

build_src_filter =
    -<*>
    +<receiver/>
    +<shared/hello_protocol.cpp>

[env:sender_hello_spi]
extends = env:sender_hello
build_flags =
    ${env:sender_hello.build_flags}
    -DHELLO_RF_DIAGNOSTIC_ONLY=1

[env:receiver_spi]
extends = env:receiver
build_flags =
    ${env:receiver.build_flags}
    -DHELLO_RF_DIAGNOSTIC_ONLY=1
