[platformio]
lib_dir = stable_lib
extra_configs =
    generated/lora_platformio.ini
default_envs = sender, receiver

[env]
platform = atmelmegaavr
board = AVR128DA28
framework = arduino
build_src_filter =
    -<*>
    -<receiver/bootloader/**>
extra_scripts = pre:tools/config/platformio_generate.py
board_build.text_section_start = ${target_layout.gateway_app_start}
upload_flags = -D
lib_deps =
    jgromes/RadioLib@7.1.2
    paulstoffregen/Time@1.6.1
build_flags =
    -Os
    -flto
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -fno-exceptions
    -fno-rtti
    -fno-threadsafe-statics
    -fno-use-cxa-atexit
    -Wl,-u,vfprintf
    -lprintf_min
    -DAPPLICATION_BUILD
    -DLORA_SSOT_GENERATED=1
    -Iinclude
    -Isrc
    -Istable_lib/ssot

[sender_sources]
build_src_filter =
    ${env.build_src_filter}
    +<sender/appcode/main.cpp>

[receiver_sources]
build_src_filter =
    ${env.build_src_filter}
    +<receiver/appcode/main.cpp>

[reliable_support]
build_src_filter =
    +<shared/diagnostics/radio_diagnostics.cpp>
    +<shared/radio/radio_link.cpp>

[arq_support]
build_src_filter =
    +<shared/diagnostics/arq_bench.cpp>
    +<shared/protocol/arq_ingress.cpp>
    +<shared/radio/arq_radio.cpp>

[env:debug]
build_type = debug
debug_build_flags = -Os -g2 -DDEBUG_BUILD=1

[env:release]
build_type = release

[env:sender]
extends = env:debug
build_src_filter =
    ${sender_sources.build_src_filter}
    +<sender/appcode/gateway/gateway_app.cpp>
    +<sender/appcode/gateway/gateway_radio.cpp>
    +<sender/appcode/gateway/espcomm.cpp>
    +<sender/appcode/gateway/io.cpp>
    +<shared/radio/radio_link.cpp>
lib_ignore =
    arq
    mvp-app
    reverse-raw-app
    legacy-sender-app
    legacy-receiver-app
build_flags =
    ${env.build_flags}
    -DLORA_APP_GATEWAY=1
upload_protocol = serialupdi
upload_port = /dev/serial/by-path/pci-0000:00:14.0-usb-0:4:1.0-port0
upload_speed = 115200
board_build.text_section_start = ${target_layout.gateway_app_start}

[env:sender_hello]
extends = env:debug
build_src_filter =
    ${sender_sources.build_src_filter}
    ${reliable_support.build_src_filter}
    +<sender/appcode/reliable.cpp>
lib_ignore =
    arq
    mvp-app
    reverse-raw-app
    legacy-sender-app
    legacy-receiver-app
upload_protocol = serialupdi
upload_port = /dev/serial/by-path/pci-0000:00:14.0-usb-0:4:1.0-port0
upload_speed = 115200
board_build.text_section_start = ${target_layout.gateway_app_start}
build_flags =
    ${env.build_flags}
    -DLORA_APP_RELIABLE=1
    -DHELLO_TEST_MODE=1
    -DHELLO_RAM_ONLY_TEST=1
    -DLORA_NONBLOCKING_LOG=1
    -DRADIOLIB_FIX_ERRATA_SX127X=1

[env:receiver]
extends = env:debug
build_src_filter =
    ${receiver_sources.build_src_filter}
    ${reliable_support.build_src_filter}
    +<receiver/appcode/reliable.cpp>
lib_ignore =
    arq
    mvp-app
    reverse-raw-app
    legacy-sender-app
    legacy-receiver-app
build_flags =
    ${env.build_flags}
    -DLORA_APP_RELIABLE=1
    -DLORA_NONBLOCKING_LOG=1
    -DRADIOLIB_FIX_ERRATA_SX127X=1
upload_protocol = serialupdi
upload_port = /dev/serial/by-path/pci-0000:00:14.0-usb-0:1:1.0-port0
upload_speed = 115200
board_build.text_section_start = ${target_layout.receiver_app_start}

[env:sender_hello_spi]
extends = env:sender_hello
build_flags =
    ${env:sender_hello.build_flags}
    -DHELLO_RF_DIAGNOSTIC_ONLY=1

[env:sender_hello_5dbm]
extends = env:sender_hello
build_flags =
    ${env:sender_hello.build_flags}
    -DLORA_TEST_TX_POWER_DBM=5

[env:receiver_5dbm]
extends = env:receiver
build_flags =
    ${env:receiver.build_flags}
    -DLORA_TEST_TX_POWER_DBM=5

[env:receiver_spi]
extends = env:receiver
build_flags =
    ${env:receiver.build_flags}
    -DHELLO_RF_DIAGNOSTIC_ONLY=1

[env:sender_mvp]
extends = env:sender
build_src_filter = ${sender_sources.build_src_filter}
lib_ignore =
    arq
    reverse-raw-app
    legacy-sender-app
    legacy-receiver-app
build_flags =
    ${env:sender.build_flags}
    -ULORA_APP_GATEWAY
    -DLORA_APP_MVP=1

[env:receiver_mvp]
extends = env:receiver
build_src_filter = ${receiver_sources.build_src_filter}
lib_ignore =
    arq
    reverse-raw-app
    legacy-sender-app
    legacy-receiver-app
build_flags =
    ${env:receiver.build_flags}
    -ULORA_APP_RELIABLE
    -DLORA_APP_MVP=1
[env:sender_arq]
extends = env:sender
build_src_filter =
    ${sender_sources.build_src_filter}
    ${arq_support.build_src_filter}
    +<sender/appcode/arq/sender.cpp>
lib_ignore =
    mvp-app
    reverse-raw-app
    legacy-sender-app
    legacy-receiver-app
build_flags =
    ${env:sender.build_flags}
    -ULORA_APP_GATEWAY
    -DLORA_APP_ARQ=1
    -fstack-usage
[env:receiver_arq]
extends = env:receiver
build_src_filter =
    ${receiver_sources.build_src_filter}
    ${arq_support.build_src_filter}
    +<receiver/appcode/arq/receiver.cpp>
lib_ignore =
    mvp-app
    reverse-raw-app
    legacy-sender-app
    legacy-receiver-app
build_flags =
    ${env:receiver.build_flags}
    -ULORA_APP_RELIABLE
    -DLORA_APP_ARQ=1
    -fstack-usage
[env:sender_arq_test]
extends = env:sender_arq
build_flags =
    ${env:sender_arq.build_flags}
    -DARQ_TEST_MODE=1
[env:receiver_arq_test]
extends = env:receiver_arq
build_flags =
    ${env:receiver_arq.build_flags}
    -DARQ_TEST_MODE=1

[env:sender_arq_radio_only]
extends = env:sender_arq_test
build_flags =
    ${env:sender_arq_test.build_flags}
    -DARQ_RADIO_ONLY_DIAGNOSTIC=1
    -DRADIOLIB_FIX_ERRATA_SX127X=1

[env:receiver_arq_radio_only]
extends = env:receiver_arq_test
build_flags =
    ${env:receiver_arq_test.build_flags}
    -DARQ_RADIO_ONLY_DIAGNOSTIC=1

[env:sender_reverse_raw]
extends = env:sender_arq
build_src_filter = ${sender_sources.build_src_filter}
lib_ignore =
    mvp-app
    legacy-sender-app
    legacy-receiver-app
build_flags =
    ${env:sender_arq.build_flags}
    -ULORA_APP_ARQ
    -DLORA_APP_REVERSE_RAW=1

[env:sender_arq_radio_only_reverse]
extends = env:sender_arq_radio_only
build_src_filter =
    ${sender_sources.build_src_filter}
    ${arq_support.build_src_filter}
    +<receiver/appcode/arq/receiver.cpp>
build_flags =
    ${env:sender_arq_radio_only.build_flags}
    -DARQ_REVERSE_DIAGNOSTIC=1

[env:receiver_arq_radio_only_reverse]
extends = env:receiver_arq_radio_only
build_src_filter =
    ${receiver_sources.build_src_filter}
    ${arq_support.build_src_filter}
    +<sender/appcode/arq/sender.cpp>
build_flags =
    ${env:receiver_arq_radio_only.build_flags}
    -DARQ_REVERSE_DIAGNOSTIC=1

[env:receiver_reverse_raw]
extends = env:receiver_arq
build_src_filter = ${receiver_sources.build_src_filter}
lib_ignore =
    mvp-app
    legacy-sender-app
    legacy-receiver-app
build_flags =
    ${env:receiver_arq.build_flags}
    -ULORA_APP_ARQ
    -DLORA_APP_REVERSE_RAW=1
