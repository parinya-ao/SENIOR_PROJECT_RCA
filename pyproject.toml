[project]
name = "lora"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "parinya-ao", email = "flim.parinya.ao@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "prompt-toolkit>=3.0.53",
    "pyserial>=3.5",
    "rich>=15.0.0",
    "typer>=0.29.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "black>=26.10.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.4",
    "tach==0.35.3",
    "types-pyserial>=3.5.0.20261104",
]

[tool.ruff]
target-version = "py314"
line-length = 100
force-exclude = true
extend-exclude = [
    ".pio",
    "artifacts",
    "docs/rca",
    "graphify-out",
    "generated/**",
    "third_party",
    "get-platformio.py",
    "tools/config/lora_profile.py", # Generated from the radio configuration.
    "tools/config/platformio_generate.py", # Loaded by PlatformIO with SCons-injected globals.
]

[tool.ruff.lint]
# E=Error, F=Pyflakes, C90=Complexity, B=Bugbear, UP=Upgrade, PL=Pylint
select = ["E", "F", "C90", "B", "UP", "PL", "RET", "SIM", "RUF", "D", "PTH", "S", "TID"]
ignore = []

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-statements = 50
allow-magic-value-types = []

[tool.ruff.lint.flake8-bandit]
check-typed-exception = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004"]
"src/dashboard/config.py" = ["PLR2004"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.14"
files = ["tools", "tests"]
exclude = [
    '^(\.pio|artifacts|docs/rca|generated|graphify-out|third_party)/',
    '^(get-platformio\.py|tools/bootstrap/get-platformio\.py)$',
    '^tools/config/(lora_profile|platformio_generate)\.py$',
]
explicit_package_bases = true
mypy_path = ["$MYPY_CONFIG_FILE_DIR"]
strict = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
