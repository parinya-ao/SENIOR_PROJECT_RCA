[project]
name = "lora"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "parinya-ao", email = "flim.parinya.ao@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pyserial>=3.5",
]

[project.scripts]
lora = "lora:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "ruff>=0.17.5",
    "types-pyserial>=3.5.0.20261104",
]

[tool.ruff]
target-version = "py314"
line-length = 100
force-exclude = true
extend-exclude = [
    ".pio",
    "artifacts",
    "docs/rca",
    "graphify-out",
    "third_party",
    "get-platformio.py",
    "tools/config/lora_profile.py", # Generated from the radio configuration.
]

[tool.ruff.lint]
select = ["ALL"]
# The formatter owns these choices; D212 selects first-line docstring summaries.
ignore = [
    "W191", "E111", "E114", "E117", "D203", "D206", "D213", "D300",
    "Q000", "Q001", "Q002", "Q003", "Q004", "COM812", "COM819",
]

[tool.ruff.lint.per-file-ignores]
# Keep the existing unittest framework and its assertion/exception APIs.
"tests/**/*.py" = ["PT009", "PT027", "S101"]

[tool.mypy]
python_version = "3.14"
files = ["src/lora", "tools", "tests"]
exclude = ['^tools/config/lora_profile\.py$']
explicit_package_bases = true
mypy_path = ["$MYPY_CONFIG_FILE_DIR/src"]
strict = true
extra_checks = true
disallow_any_unimported = true
warn_unreachable = true
warn_unused_configs = true
show_error_codes = true
show_column_numbers = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool", "possibly-undefined"]
